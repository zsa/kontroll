[package]
name = "kontroll"
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Control ZSA keyboards (layers, RGB and status LEDs, brightness) from the command line or Rust, over USB or Bluetooth."
homepage = "https://blog.zsa.io/introducing-kontroll/"
repository = "https://github.com/zsa/kontroll"
readme = "README.md"

[lib]
name = "kontroll"
path = "src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "kontroll"
path = "src/main.rs"

[features]
default = ["ble"]
# Wireless Voyager over Bluetooth.
ble = ["dep:zapp-ble"]

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
serde = { version = "1.0.204", features = ["serde_derive"] }
serde_json = "1.0.120"
zapp-ble = { version = "0.1.0", path = "../zapp/zapp-ble", optional = true }
zapp-core = { version = "0.1.1", path = "../zapp/zapp-core" }
zapp-hid-proto = { version = "0.1.0", path = "../zapp/zapp-hid-proto" }

[dev-dependencies]
assert_cmd = "2.0.15"
hidapi = "2"
macroquad = "0.4"
